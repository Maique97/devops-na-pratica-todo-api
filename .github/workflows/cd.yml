name: CD

# Entrega Contínua: roda automaticamente quando o CI termina com sucesso na main
# (a imagem já foi testada, escaneada e publicada no GHCR com a tag do commit).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag da imagem a implantar (SHA do commit). Vazio = latest"
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Preparar release
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.vars.outputs.image }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - id: vars
        run: |
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="${{ github.event.workflow_run.head_sha || inputs.image_tag }}"
          TAG="${TAG:-latest}"
          echo "image=${REPO}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "### Release candidata: \`${REPO}:${TAG}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    name: Deploy em staging (Kubernetes)
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Baixar a imagem aprovada no CI
        run: docker pull "${{ needs.prepare.outputs.image }}"

      - name: Criar cluster Kubernetes de staging (Kind)
        run: |
          if ! command -v kind >/dev/null; then
            curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
            chmod +x kind && sudo mv kind /usr/local/bin/kind
          fi
          kind create cluster --name staging --wait 120s
          kind load docker-image "${{ needs.prepare.outputs.image }}" --name staging
          kubectl get nodes -o wide

      - name: Deploy com rolling update e rollback automático
        run: bash scripts/deploy-k8s.sh "${{ needs.prepare.outputs.image }}" staging

      - name: Verificar observabilidade (métricas e logs)
        run: |
          kubectl -n todo-api port-forward svc/todo-api 8080:80 >/dev/null 2>&1 &
          sleep 3
          for i in $(seq 1 20); do curl -s -o /dev/null http://localhost:8080/tasks; done
          echo "--- Métricas Prometheus"
          curl -s http://localhost:8080/metrics | grep -E '^(http_requests_total|todo_tasks|app_info)'
          echo "--- Logs estruturados (JSON)"
          kubectl -n todo-api logs deploy/todo-api --tail=5

      - name: Resumo do deploy
        if: always()
        run: |
          {
            echo "### Staging"
            echo '```'
            kubectl -n todo-api get deploy,pods,svc,hpa 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Promoção para produção
    needs: [prepare, deploy-staging]
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promover imagem (tag production)
        run: |
          IMAGE="${{ needs.prepare.outputs.image }}"
          PROD="${IMAGE%:*}:production"
          docker pull "$IMAGE"
          docker tag "$IMAGE" "$PROD"
          docker push "$PROD"
          echo "### Produção: \`${IMAGE}\` promovida para \`${PROD}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Configurar credenciais AWS (OIDC)
        if: vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Deploy na EC2 via SSM
        if: vars.AWS_ROLE_ARN != '' && vars.EC2_INSTANCE_ID != ''
        run: bash scripts/deploy-ec2.sh "${{ vars.EC2_INSTANCE_ID }}" "${{ needs.prepare.outputs.image }}"

      - name: Aviso (infraestrutura AWS não provisionada)
        if: vars.AWS_ROLE_ARN == ''
        run: echo "::notice::Variáveis AWS_ROLE_ARN/EC2_INSTANCE_ID não configuradas; deploy na EC2 ignorado. Imagem promovida no GHCR."
