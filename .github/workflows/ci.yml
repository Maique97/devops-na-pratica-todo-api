name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, segurança e testes (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 .

      - name: Análise estática de segurança (Bandit)
        run: bandit -r app -ll

      - name: Auditoria de dependências (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Testes automatizados (pytest + cobertura >= 80%)
        run: pytest

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  terraform:
    name: Validação do Terraform (IaC)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Verificar formatação
        run: terraform fmt -check -recursive

      - name: Inicializar (sem backend remoto)
        run: terraform init -backend=false -input=false

      - name: Validar sintaxe e referências
        run: terraform validate

  manifests:
    name: Validação de scripts, Compose e Kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck nos scripts de deploy
        run: shellcheck scripts/*.sh

      - name: Validar docker-compose.yml
        run: docker compose config -q

      - name: Renderizar manifests Kubernetes (kustomize)
        run: kubectl kustomize k8s/ > /tmp/rendered.yaml && cat /tmp/rendered.yaml

  docker:
    name: Build, scan e publicação da imagem
    runs-on: ubuntu-latest
    needs: [test, terraform, manifests]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Definir nome da imagem (minúsculas)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build da imagem Docker
        run: |
          docker build \
            --build-arg APP_VERSION="2.0.${{ github.run_number }}" \
            --build-arg VCS_REF="${{ github.sha }}" \
            -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .

      - name: Scan de vulnerabilidades da imagem (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.2 image \
            --db-repository mirror.gcr.io/aquasec/trivy-db \
            --severity HIGH,CRITICAL --ignore-unfixed --no-progress \
            --exit-code 0 --format table "$IMAGE:${{ github.sha }}"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.2 image \
            --db-repository mirror.gcr.io/aquasec/trivy-db \
            --severity CRITICAL --ignore-unfixed --no-progress \
            --exit-code 1 --quiet "$IMAGE:${{ github.sha }}"

      - name: Smoke test do container
        run: |
          docker run -d --name api -p 8080:5000 "$IMAGE:${{ github.sha }}"
          bash scripts/smoke-test.sh http://localhost:8080
          docker logs api | tail -5

      - name: Login no GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagem
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
